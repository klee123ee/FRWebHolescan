<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>新建扫描任务</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='layui/css/layui.css') }}">
</head>
<body>
    <div class="layui-layout layui-layout-admin">
        <!-- 头部区域 -->
        <div class="layui-header">
            <div class="layui-logo">Web漏洞扫描系统</div>
            <ul class="layui-nav layui-layout-right">
                <li class="layui-nav-item">
                    <a href="javascript:;">
                        <span>{{ session.username }}</span>
                    </a>
                    <dl class="layui-nav-child">
                        <dd><a href="{{ url_for('user.profile') }}">个人中心</a></dd>
                        <dd><a href="{{ url_for('auth.logout') }}">退出登录</a></dd>
                    </dl>
                </li>
            </ul>
        </div>

        <!-- 左侧导航区域 -->
        <div class="layui-side layui-bg-black">
            <div class="layui-side-scroll">
                <ul class="layui-nav layui-nav-tree">
                    <li class="layui-nav-item">
                        <a href="{{ url_for('main.index') }}">首页</a>
                    </li>
                    <li class="layui-nav-item layui-this">
                        <a href="javascript:;">扫描管理</a>
                        <dl class="layui-nav-child">
                            <dd><a href="{{ url_for('scan.new_scan') }}" class="layui-this">新建扫描</a></dd>
                            <dd><a href="{{ url_for('scan.list') }}">扫描列表</a></dd>
                        </dl>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;">漏洞管理</a>
                        <dl class="layui-nav-child">
                            <dd><a href="{{ url_for('scan.vuln_list') }}">漏洞列表</a></dd>
                        </dl>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;">POC管理</a>
                        <dl class="layui-nav-child">
                            <dd><a href="{{ url_for('scan.poc_list') }}">POC列表</a></dd>
                        </dl>
                    </li>
                </ul>
            </div>
        </div>

        <!-- 内容主体区域 -->
        <div class="layui-body">
            <div style="padding: 15px;">
                <form class="layui-form" action="{{ url_for('scan.new_scan') }}" method="post">
                    <div class="layui-form-item">
                        <label class="layui-form-label">任务名称</label>
                        <div class="layui-input-block">
                            <input type="text" name="task_name" required lay-verify="required" placeholder="请输入任务名称" autocomplete="off" class="layui-input">
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">目标URL</label>
                        <div class="layui-input-block">
                            <input type="text" name="target_url" required lay-verify="required|url" placeholder="请输入目标URL" autocomplete="off" class="layui-input">
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">扫描深度</label>
                        <div class="layui-input-block">
                            <input type="number" name="scan_depth" value="3" min="1" max="10" class="layui-input">
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">线程数</label>
                        <div class="layui-input-block">
                            <input type="number" name="thread_count" value="10" min="1" max="50" class="layui-input">
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">POC选择</label>
                        <div class="layui-input-block">
                            <select name="poc_ids" lay-verify="required" multiple>
                                <option value="">请选择POC</option>
                                <!-- POC列表将通过后端动态加载 -->
                            </select>
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">扫描选项</label>
                        <div class="layui-input-block">
                            <input type="checkbox" name="scan_options" value="subdomain" title="子域名扫描">
                            <input type="checkbox" name="scan_options" value="port" title="端口扫描">
                            <input type="checkbox" name="scan_options" value="vuln" title="漏洞扫描">
                        </div>
                    </div>

                    <div class="layui-form-item layui-form-text">
                        <label class="layui-form-label">备注</label>
                        <div class="layui-input-block">
                            <textarea name="description" placeholder="请输入备注信息" class="layui-textarea"></textarea>
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <div class="layui-input-block">
                            <button class="layui-btn" lay-submit lay-filter="scanForm">立即提交</button>
                            <button type="reset" class="layui-btn layui-btn-primary">重置</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- 底部固定区域 -->
        <div class="layui-footer">
            © Web漏洞扫描系统
        </div>
    </div>

    <script src="{{ url_for('static', filename='layui/layui.js') }}"></script>
    <script>
        layui.use(['form', 'layer'], function(){
            var form = layui.form;
            var layer = layui.layer;
            
            // 监听提交
            form.on('submit(scanForm)', function(data){
                layer.msg('提交中...', {icon: 16, time: 0});
                return true;
            });
        });
    </script>
</body>
</html>
