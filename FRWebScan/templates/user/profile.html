<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资料 - 风刃Web漏洞扫描系统</title>
    <!-- 引入Layui CSS -->
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <link rel="stylesheet" href="/static/layui/css/self.css">
    <!-- 引入字体图标 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</head>
<body class="layui-layout-body">
    <!-- 整体布局 -->
    <div class="layui-layout layui-layout-admin">
        <!-- 头部区域 -->
        <div class="layui-header">
            <div class="layui-logo">
                <i class="fas fa-shield-alt"></i> 风刃Web漏洞扫描系统
            </div>
            <ul class="layui-nav layui-layout-right">
                <li class="layui-nav-item">
                    <a href="javascript:;">
                        <img src="" class="layui-nav-img">
                        <span class="user-name">{{ session['username'] }}</span>
                    </a>
                    <dl class="layui-nav-child">
                        <dd><a href="{{ url_for('user.profile') }}"><i class="fas fa-user"></i> 基本资料</a></dd>
                    </dl>
                </li>
                <li class="layui-nav-item"><a href="{{ url_for('auth.logout') }}"><i class="fas fa-sign-out-alt"></i> 退出</a></li>
            </ul>
        </div>

        <!-- 左侧导航菜单 -->
        <div class="layui-side layui-bg-black">
            <div class="layui-side-scroll">
                <ul class="layui-nav layui-nav-tree">
                    <!-- 个人中心 -->
                    <li class="layui-nav-item layui-nav-itemed">
                        <a href="javascript:;"><i class="fas fa-user-circle"></i> 个人中心</a>
                        <dl class="layui-nav-child">
                            <dd class="layui-this"><a href="{{ url_for('user.profile') }}"><i class="fas fa-user"></i> 基本资料</a></dd>
                            <dd><a href="{{ url_for('user.log') }}"><i class="fas fa-history"></i> 操作日志</a></dd>
                            <dd><a href="{{ url_for('auth.resetpassword') }}"><i class="fas fa-lock"></i> 修改密码</a></dd>
                        </dl>
                    </li>
                </ul>
            </div>
        </div>

        <!-- 主体内容区域 -->
        <div class="layui-body">
            <div class="layui-card">
                <div class="layui-card-header">
                    <i class="fas fa-user"></i> 基本资料
                    <div class="layui-inline layui-card-header-right">
                        <a href="{{ url_for('main.index') }}" class="layui-btn layui-btn-primary layui-btn-sm" style="color: #fff;">
                            <i class="fas fa-tachometer-alt" style="color: #fff;"></i> 返回仪表盘
                        </a>
                    </div>
                </div>
                <div class="layui-card-body">
                    <form class="layui-form" lay-filter="profileForm">
                        <div class="layui-form-item">
                            <label class="layui-form-label">用户名</label>
                            <div class="layui-input-block">
                                <input type="text" name="username" value="{{ session['username'] }}" class="layui-input" disabled>
                            </div>
                        </div>
                        <div class="layui-form-item layui-form-text">
                            <label class="layui-form-label">个人简介</label>
                            <div class="layui-input-block">
                                <textarea name="bio" placeholder="请输入个人简介" class="layui-textarea"></textarea>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-input-block">
                                <button class="layui-btn" lay-submit lay-filter="profileForm">保存修改</button>
                                <button type="reset" class="layui-btn layui-btn-primary" style="color: white">重置</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- 底部区域 -->
        <div class="layui-footer">
            <div class="footer-content">
                <div class="footer-links">
                    <a href="https://github.com/your-repo" target="_blank"><i class="fab fa-github"></i> GitHub</a>
                    <a href="https://docs.your-site.com" target="_blank"><i class="fas fa-book"></i> 文档</a>
                    <a href="https://forum.your-site.com" target="_blank"><i class="fas fa-comments"></i> 社区</a>
                </div>
                <div class="copyright">
                    &copy; 2025 风刃Web漏洞扫描系统 | 采用 <a href="https://layui.dev/" target="_blank">Layui框架</a> 开发
                </div>
            </div>
        </div>
    </div>

    <script src="/static/layui/layui.js"></script>
    <script>
        layui.use('element', function(){
            var element = layui.element;
        });
    </script>
</body>
</html>
